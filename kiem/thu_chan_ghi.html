<!doctype html><html><head><meta charset="utf-8"></head>
<!-- Trang mẫu kiểm chặn ghi. Chạy qua kiem/test_dong_goi.py (cần máy chủ thử trên 127.0.0.1), không mở tay. -->
<body><nav><a href="#a">Mục A</a><a href="#b">Mục B</a><a href="#c">Mục C</a></nav><main><h1>Trang mẫu</h1></main>
<script>window.__loi = []; addEventListener('error', e => __loi.push(e.message));</script>
<script src="tool.js"></script>
<script>
// chờ tool khởi động xong: lúc khởi động, không có lượt chạy dở thì tool nhả lá chắn (chayTiepSauTaiLai → nhaLaChan)
addEventListener('load', () => setTimeout(async () => {
  const LC = window.__dqtvLaChan, kq = { loi_js: '' };
  // 1. quyết định của lá chắn, không gửi gì
  const CA = [['POST', '/api/session'], ['POST', '/api/search?q=a'], ['POST', '/api/duty-registrations/1/extend-age'],
    ['POST', '/api/discipline-cases/1/extend-deadline'], ['POST', '/api/x/renew'], ['POST', '/api/session/extend'],
    ['POST', '/api/auth/refresh'], ['PUT', '/api/session'], ['DELETE', '/api/session'], ['PATCH', '/api/search'],
    ['POST', 'https://khac.example/api/session'], ['GET', '/api/duty-registrations/1']];
  kq.quyet_dinh = Object.fromEntries(CA.map(([m, u]) => [m + ' ' + u, LC.ghiChat(m, u)]));
  // 2. gửi thật qua lá chắn tới máy chủ thử: bị chặn thì lỗi có dấu __dqtv; đi qua thì máy chủ trả mã (501)
  LC.quyetDinh = LC.ghiChat;
  const gui = async u => { try { const r = await fetch(u, { method: 'POST', body: '{}' }); return 'đi qua (' + r.status + ')'; } catch (e) { return e.__dqtv ? 'bị chặn' : 'lỗi khác: ' + e.message; } };
  kq.gui_that = { '/api/session': await gui('/api/session'), '/api/duty-registrations/1/extend-age': await gui('/api/duty-registrations/1/extend-age') };
  LC.quyetDinh = null;
  // 3. đang chạy kiểm mà truyền công tắc mở ghi: vẫn phải chặn
  dqtv.chay({ tenMienDuocChay: null, chanGhi: false, mucQuyTrinh: 3, moiTruongKiemThu: [location.hostname] });
  for (let i = 0; i < 60 && !LC.quyetDinh; i++) await new Promise(r => setTimeout(r, 25));
  kq.khi_chay = LC.quyetDinh ? { 'PUT /api/units/1': LC.quyetDinh('PUT', '/api/units/1'), 'POST /api/units/1/approve': LC.quyetDinh('POST', '/api/units/1/approve'), 'POST /api/search': LC.quyetDinh('POST', '/api/search') } : 'không bắt được lúc đang chạy';
  try { dqtv.dung(); } catch (e) {}
  kq.loi_js = __loi.join(' | ') || 'không';
  document.body.setAttribute('data-kq', JSON.stringify(kq));
}, 800));
</script></body></html>
